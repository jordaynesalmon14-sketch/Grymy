<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<body>
<!--
  ============================================================
  LINK-IN-BIO SITE — STANDALONE, FOR NETLIFY
  ============================================================
  HOW TO DEPLOY:
  1. Save this file as "index.html" in its own folder on your
     computer (just that one file, nothing else needed).
  2. Go to netlify.com and drag that folder onto the deploy area
     on your dashboard (Sites > "Add new site" > "Deploy manually").
     No account setup beyond a free Netlify login is required.
  3. Netlify gives you a temporary *.netlify.app URL immediately —
     the site is already live at that point.
  4. To use .com instead: in the site's Netlify
     dashboard, go to Domain settings > Add a domain, enter
     punchmadedev.com, and Netlify will show you either a set of
     nameservers or a couple of DNS records to add. Wherever your
     domain is currently registered (this was Squarespace Domains),
     you'll update its DNS settings to point to Netlify using
     whichever option Netlify shows you. This part can take a
     few hours to fully switch over.

  HOW TO EDIT:
  Everything you'd want to change lives in the CONFIG object
  below, inside the <script> tag near the bottom. Edit values
  there only — you do not need to touch the CSS or HTML to
  update your name, links, avatar, video, or song. After editing,
  just re-drag the updated file onto Netlify to redeploy (or
  connect a GitHub repo later for automatic deploys on save).
  ============================================================
-->
<div id="bio-root"></div>

<style>
  #bio-root, #bio-root *{ box-sizing:border-box; }

  html, body{
    overflow-x:hidden;
    background:#000000;
    background-image:
      radial-gradient(circle at 20% 0%, rgba(155,89,255,0.07), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(124,77,255,0.05), transparent 45%);
    margin:0;
    padding:0;
  }

  #bio-root{
    --bg: #000000;
    --bg-2: #05050a;
    --card: #0b0b10;
    --line: #1b1430;
    --text: #EDEAFF;
    --text-dim: #AFA8C8;
    --accent: #9B59FF;
    --accent-2: #7C4DFF;
    --radius: 6px;

    position:relative;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;

    background: var(--bg);
    background-image:
      radial-gradient(circle at 20% 0%, rgba(155,89,255,0.07), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(124,77,255,0.05), transparent 45%);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding: 24px 20px 32px;
    overflow:hidden;
  }

  /* CRT scanline overlay for that terminal glow */
  #bio-root::before{
    content:'';
    position:absolute;
    inset:0;
    pointer-events:none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(155,89,255,0.035) 0px,
      rgba(155,89,255,0.035) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 1;
  }

  /* small $ signs drifting around in the background, full page */
  .bio-float-layer{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:1;
  }
  .bio-float{
    position:absolute;
    color: var(--accent);
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-weight:700;
    line-height:1;
    filter: drop-shadow(0 0 4px rgba(155,89,255,0.35));
    animation-name: bio-float-drift;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  @keyframes bio-float-drift{
    0%   { transform: translate(0,0) rotate(0deg); }
    25%  { transform: translate(4px,-10px) rotate(6deg); }
    50%  { transform: translate(-3px,-18px) rotate(-4deg); }
    75%  { transform: translate(3px,-9px) rotate(5deg); }
    100% { transform: translate(0,0) rotate(0deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .bio-float{ animation:none; }
  }

  .bio-wrap{
    position:relative;
    z-index: 2;
    max-width: 480px;
    margin: 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* terminal window title bar — the signature element */
  .bio-stats-bar{
    width:100%;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
    gap: 7px;
    row-gap: 5px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 9px;
    margin-bottom: 34px;
    font-size: 9.5px;
    letter-spacing: 0.01em;
  }
  .bio-stat{
    display:flex;
    align-items:baseline;
    gap: 5px;
    white-space:nowrap;
  }
  .bio-stat-label{
    color: var(--text-dim);
    font-weight:600;
  }
  .bio-stat-value{
    color: var(--accent);
    font-weight:700;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 6px rgba(155,89,255,0.4);
  }
  .bio-stat-sep{
    width:1px;
    height:12px;
    background: var(--line);
    flex-shrink:0;
  }
  .bio-stat-live{
    display:flex;
    align-items:center;
    gap: 6px;
  }
  .bio-stat-live-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background: var(--accent);
    box-shadow: 0 0 6px rgba(155,89,255,0.8);
    animation: bio-live-pulse 1.4s ease-in-out infinite;
    flex-shrink:0;
  }
  @keyframes bio-live-pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.45; transform:scale(0.75); }
  }
  @media (prefers-reduced-motion: reduce){
    .bio-stat-live-dot{ animation:none; }
  }

  @keyframes bio-pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.4; }
  }

  .bio-avatar{
    width: 92px;
    height: 92px;
    border-radius: var(--radius);
    background: var(--bg-2);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'JetBrains Mono', monospace;
    margin-bottom: 18px;
    border: 1px solid var(--accent);
    box-shadow: 0 0 0 1px rgba(155,89,255,0.15), 0 0 22px rgba(155,89,255,0.18);
    overflow:hidden;
    background-size: cover;
    background-position: center;
  }

  .bio-avatar-icon{
    width: 52px;
    height: 52px;
    color: var(--accent);
    filter: drop-shadow(0 0 6px rgba(155,89,255,0.55));
    animation: bio-avatar-glitch 4.5s infinite;
  }
  @keyframes bio-avatar-glitch{
    0%, 92%, 100%{
      transform: translate(0,0);
      clip-path: inset(0 0 0 0);
      filter: drop-shadow(0 0 6px rgba(155,89,255,0.55));
    }
    92.5%{ transform: translate(-2px,1px); clip-path: inset(8% 0 46% 0); }
    93.5%{ transform: translate(2px,-1px); clip-path: inset(55% 0 6% 0); filter: drop-shadow(0 0 9px rgba(124,77,255,0.7)); }
      94.5%{ transform: translate(-1px,0); clip-path: inset(22% 0 55% 0); filter: drop-shadow(0 0 9px rgba(124,77,255,0.7)); }
    95.5%{ transform: translate(1px,0); clip-path: inset(0 0 0 0); }
  }
  @media (prefers-reduced-motion: reduce){
    .bio-avatar-icon{ animation:none; }
  }

  /* lock icon: shackle swings open then closed again, on a loop */
  .bio-avatar-icon--lock{
    animation: none;
  }
  .bio-lock-shackle{
    transform-origin: 9px 11px;
    animation: bio-lock-cycle 4.5s ease-in-out infinite;
  }
  @keyframes bio-lock-cycle{
    0%, 20%  { transform: translate(0,0) rotate(0deg); }
    40%, 70% { transform: translate(2.5px,-1px) rotate(-28deg); }
    90%,100% { transform: translate(0,0) rotate(0deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .bio-lock-shackle{ animation:none; }
  }

  /* card reader: a card slides through the slot on a loop */
  .bio-avatar-icon--reader{
    animation: none;
    overflow: hidden;
  }
  .bio-swipe-card{
    animation: bio-swipe 1.8s linear infinite;
  }
  @keyframes bio-swipe{
    0%   { transform: translateX(-20px); }
    100% { transform: translateX(20px); }
  }
  @media (prefers-reduced-motion: reduce){
    .bio-swipe-card{ animation:none; transform:translateX(0); }
  }

  @keyframes bio-bounce-in{
    0%   { opacity:0; transform: scale(0.3) translateY(14px); }
    50%  { opacity:1; transform: scale(1.08) translateY(-4px); }
    70%  { transform: scale(0.95) translateY(2px); }
    100% { opacity:1; transform: scale(1) translateY(0); }
  }

  .bio-name{
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size: 19px;
    font-weight:700;
    letter-spacing: 0.02em;
    margin: 0 0 22px;
    text-align:center;
    color: var(--accent);
    text-shadow: 0 0 12px rgba(155,89,255,0.35);
    animation: bio-bounce-in 0.6s cubic-bezier(.28,1.4,.55,1) both;
    animation-delay: 0.05s;
  }
  .bio-verified-badge{
    width: 16px;
    height: 16px;
    margin-left: 2px;
    vertical-align: middle;
    color: var(--accent);
    filter: drop-shadow(0 0 4px rgba(155,89,255,0.6));
  }

  .bio-icon-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 22px;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }
  .bio-icon-row a{
    color: var(--text);
    display:flex;
    position:relative;
    z-index:2;
    padding:8px;
    margin:-8px;
    cursor:pointer;
    pointer-events:auto;
    transition: color .15s ease, transform .15s ease;
    animation: bio-bounce-in 0.6s cubic-bezier(.28,1.4,.55,1) both;
  }
  .bio-icon-row a:nth-child(1){ animation-delay: 0.15s; }
  .bio-icon-row a:nth-child(2){ animation-delay: 0.22s; }
  .bio-icon-row a:nth-child(3){ animation-delay: 0.29s; }
  .bio-icon-row a:nth-child(4){ animation-delay: 0.36s; }
  .bio-icon-row a:nth-child(5){ animation-delay: 0.43s; }
  .bio-icon-row a:nth-child(6){ animation-delay: 0.50s; }

  .bio-card{
    animation: bio-bounce-in 0.6s cubic-bezier(.28,1.4,.55,1) both;
  }
  .bio-card:nth-child(1){ animation-delay: 0.55s; }
  .bio-card:nth-child(2){ animation-delay: 0.62s; }
  .bio-card:nth-child(3){ animation-delay: 0.69s; }
  .bio-card:nth-child(4){ animation-delay: 0.76s; }

  @media (prefers-reduced-motion: reduce){
    .bio-name, .bio-icon-row a, .bio-card{ animation: none; }
  }
  .bio-icon-row a:hover{
    color: var(--accent);
    transform: translateY(-2px);
    filter: drop-shadow(0 0 6px rgba(255,138,101,0.6));
  }
  .bio-icon-row a:focus-visible{
    outline: 1px solid var(--accent);
    outline-offset: 4px;
    border-radius: 4px;
  }
  .bio-icon-row svg{ width:22px; height:22px; stroke: currentColor; fill:none; }

  .bio-links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap: 12px;
    margin-bottom: 8px;
  }

  .bio-card{
    display:flex;
    align-items:center;
    gap: 12px;
    width:100%;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    text-decoration:none;
    color: var(--text);
    transition: border-color .15s ease, transform .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .bio-card::before{
    content:'>';
    color: var(--accent);
    font-weight:700;
    flex-shrink:0;
  }
  .bio-card:hover{
    border-color: var(--accent);
    transform: translateY(-1px);
    background: #0F1B10;
    box-shadow: 0 0 16px rgba(255,138,101,0.15);
  }
  .bio-card:focus-visible{
    outline: 1px solid var(--accent);
    outline-offset: 2px;
  }
  .bio-card .bio-thumb{
    width: 40px;
    height: 40px;
    border-radius: 4px;
    flex-shrink:0;
    background: var(--bg-2);
    border: 1px solid var(--line);
    background-size: cover;
    background-position: center;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .bio-card .bio-thumb.bio-thumb--bare{
    background: none;
    border: none;
  }
  .bio-thumb-icon{
    width: 20px;
    height: 20px;
    color: var(--accent);
    filter: drop-shadow(0 0 5px rgba(255,138,101,0.75));
    animation: bio-thumb-glow 2.2s ease-in-out infinite;
  }
  .bio-thumb--bare .bio-thumb-icon{
    width: 26px;
    height: 26px;
  }
  @keyframes bio-thumb-glow{
    0%,100%{ opacity:1; }
    50%{ opacity:0.55; }
  }
  @media (prefers-reduced-motion: reduce){
    .bio-thumb-icon{ animation:none; }
  }

  /* ATM bills sliding out of the slot, looping */
  .bio-atm-bill{
    transform-box: fill-box;
    transform-origin: 50% 0%;
  }
  .bio-atm-bill-1{
    animation: bio-atm-bill-1-spit 1.5s ease-in infinite;
  }
  .bio-atm-bill-2{
    animation: bio-atm-bill-2-spit 1.5s ease-in infinite;
    animation-delay: 0.5s;
  }
  @keyframes bio-atm-bill-1-spit{
    0%   { transform: rotate(-10deg) translateY(-2px); opacity:0; }
    20%  { opacity:1; }
    60%  { transform: rotate(-10deg) translateY(3px); opacity:1; }
    100% { transform: rotate(-10deg) translateY(5px); opacity:0; }
  }
  @keyframes bio-atm-bill-2-spit{
    0%   { transform: rotate(8deg) translateY(-2px); opacity:0; }
    20%  { opacity:1; }
    60%  { transform: rotate(8deg) translateY(3px); opacity:1; }
    100% { transform: rotate(8deg) translateY(5px); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .bio-atm-bill-1, .bio-atm-bill-2{ animation:none; opacity:1; transform:none; }
  }

  /* money bag overflowing — bills spill up out of the tied neck, looping */
  .bio-bag-bill{
    transform-box: fill-box;
    transform-origin: 50% 100%;
  }
  .bio-bag-bill-1{
    animation: bio-bag-bill-1-spit 1.6s ease-in infinite;
  }
  .bio-bag-bill-2{
    animation: bio-bag-bill-2-spit 1.6s ease-in infinite;
    animation-delay: 0.5s;
  }
  @keyframes bio-bag-bill-1-spit{
    0%   { transform: rotate(-14deg) translateY(2px); opacity:0; }
    20%  { opacity:1; }
    60%  { transform: rotate(-14deg) translateY(-3px); opacity:1; }
    100% { transform: rotate(-14deg) translateY(-5px); opacity:0; }
  }
  @keyframes bio-bag-bill-2-spit{
    0%   { transform: rotate(10deg) translateY(2px); opacity:0; }
    20%  { opacity:1; }
    60%  { transform: rotate(10deg) translateY(-3px); opacity:1; }
    100% { transform: rotate(10deg) translateY(-5px); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .bio-bag-bill-1, .bio-bag-bill-2{ animation:none; opacity:1; transform:none; }
  }

  /* growth chart: bars rise like climbing income, staggered, looping */
  .bio-growth-bar{
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: bio-grow 1.8s ease-in-out infinite;
  }
  .bio-growth-bar-2{ animation-delay: 0.15s; }
  .bio-growth-bar-3{ animation-delay: 0.3s; }
  @keyframes bio-grow{
    0%, 15%  { transform: scaleY(0.35); }
    55%, 80% { transform: scaleY(1); }
    100%     { transform: scaleY(0.35); }
  }
  @media (prefers-reduced-motion: reduce){
    .bio-growth-bar{ animation:none; transform:scaleY(1); }
  }

  .bio-card .bio-title{
    flex:1;
    font-size: 13.5px;
    font-weight:600;
    letter-spacing: 0.01em;
    overflow-wrap: break-word;
    min-width:0;
  }
  .bio-title-highlight{
    display:inline-block;
    color: var(--accent);
    font-weight: 800;
    text-shadow: 0 0 8px rgba(255,138,101,0.75);
    animation: bio-highlight-pulse 1.6s ease-in-out infinite;
  }
  @keyframes bio-highlight-pulse{
    0%,100%{ transform:scale(1); text-shadow: 0 0 8px rgba(255,138,101,0.75); }
    50%{ transform:scale(1.08); text-shadow: 0 0 15px rgba(255,138,101,1); }
  }
  @media (prefers-reduced-motion: reduce){
    .bio-title-highlight{ animation:none; }
  }
  .bio-card .bio-arrow{
    color: var(--text-dim);
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    flex-shrink:0;
  }

  .bio-video-wrap{
    width:100%;
    margin-top: 18px;
    border-radius: var(--radius);
    overflow:hidden;
    border: 1px solid var(--line);
    aspect-ratio: 16/9;
    background: var(--bg-2);
    position:relative;
  }
  .bio-video-fallback{
    display:block;
    width:100%;
    height:100%;
    background:#000;
    color:var(--text);
    text-decoration:none;
    position:relative;
  }
  .bio-video-fallback img{ width:100%; height:100%; object-fit:cover; display:block; }
  .bio-video-fallback .fallback-label{
    position:absolute; left:0; right:0; bottom:10px; text-align:center; font-weight:700; color:var(--accent);
    background:linear-gradient(180deg,transparent,rgba(0,0,0,0.5)); padding:8px 12px; border-radius:999px; width:calc(100% - 40px); margin:0 20px;
  }
  .bio-video-poster{ position:relative; width:100%; height:100%; cursor:pointer; display:flex; align-items:center; justify-content:center; background:#000; }
  .bio-video-poster img{ width:100%; height:100%; object-fit:cover; display:block; filter:brightness(0.6); }
  .bio-play-overlay{ position:absolute; z-index:4; width:68px; height:68px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,var(--accent),var(--accent-2)); color:var(--bg); font-weight:800; font-size:22px; border:4px solid rgba(0,0,0,0.3); box-shadow:0 6px 20px rgba(124,77,255,0.32); }
  .bio-photo-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; width:100%; height:100%; }
  .bio-photo-grid a{ display:block; width:100%; height:100%; overflow:hidden; border-radius:var(--radius); border:1px solid var(--line); }
  .bio-photo-grid img{ width:100%; height:100%; object-fit:cover; display:block; transition: transform .25s ease; }
  .bio-photo-grid a:hover img{ transform: scale(1.04); }
  .bio-video-wrap iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
  }
  .bio-unmute-btn{
    position:absolute;
    bottom:10px;
    left:10px;
    z-index:3;
    display:flex;
    align-items:center;
    gap:6px;
    background: rgba(6,9,7,0.85);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 7px 12px 7px 10px;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight:700;
    letter-spacing: 0.02em;
    cursor:pointer;
    box-shadow: 0 0 12px rgba(255,138,101,0.35);
    animation: bio-unmute-pulse 1.8s ease-in-out infinite;
    transition: opacity .2s ease, transform .2s ease;
  }
  .bio-unmute-btn svg{ width:15px; height:15px; flex-shrink:0; }
  .bio-unmute-btn.bio-hide{
    opacity:0;
    pointer-events:none;
    transform: scale(.9);
  }
  @keyframes bio-unmute-pulse{
    0%,100%{ box-shadow: 0 0 8px rgba(255,138,101,0.3); }
    50%{ box-shadow: 0 0 16px rgba(255,138,101,0.6); }
  }
  @media (prefers-reduced-motion: reduce){
    .bio-unmute-btn{ animation:none; }
  }

  .bio-spotify-wrap{
    width:100%;
    margin-top: 14px;
    border-radius: var(--radius);
    overflow:hidden;
    border: 1px solid var(--line);
    background: var(--bg-2);
  }
  .bio-spotify-wrap iframe{
    width:100%;
    height: 100%;
    border:0;
    display:block;
  }

  .bio-footer{
    margin-top: 32px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 6px;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    text-align:center;
    opacity:0.8;
  }
  .bio-footer-icon{
    width: 12px;
    height: 12px;
    color: var(--accent);
    flex-shrink:0;
  }

  /* small phones (e.g. iPhone SE) — tighten spacing so nothing feels cramped */
  @media (max-width: 380px){
    #bio-root{ padding: 36px 14px 60px; }
    .bio-avatar{ width:80px; height:80px; font-size:24px; }
    .bio-name{ font-size:17px; }
    .bio-icon-row{ gap:16px; margin-bottom:24px; }
    .bio-icon-row svg{ width:20px; height:20px; }
  }

  /* tablets and desktop — the centered column gets a touch wider,
     and the stats bar gets a bit more breathing room now that
     space isn't tight */
  @media (min-width: 640px){
    .bio-wrap{ max-width: 520px; }
    .bio-stats-bar{ gap:16px; font-size:11px; padding:10px 14px; }
  }
</style>

<script>
(function(){

  // ============================================================
  // EDIT EVERYTHING BELOW THIS LINE. This is the only section
  // you should need to touch.
  // ============================================================
  const CONFIG = {

    // Your display name, shown under the avatar
    name: "PUNCHWITHCRUZ",

    // Small verified-checkmark badge shown right after your name
    showVerifiedBadge: true,

    // Set to false to remove the profile picture above your name
    // entirely. If true, paste an image/gif URL to use your own
    // photo, or leave avatarImageUrl empty to show a glitching

    const before = escTitle.slice(0, idx);
    const after = escTitle.slice(idx + escHighlight.length);
    return `${before}<span class="bio-title-highlight">${escHighlight}</span>${after}`;

    function tick(){
      const fps = 118 + Math.floor(Math.random() * 45);
      const ping = 6 + Math.floor(Math.random() * 19);
      const loss = Math.random() < 0.82 ? 0 : Math.round(Math.random() * 8) / 10;
      users = Math.max(900, Math.min(1800, users + (Math.floor(Math.random() * 9) - 4)));

      fpsEl.textContent = fps;
      pingEl.textContent = ping + 'ms';
      if(lossEl) lossEl.textContent = loss.toFixed(1) + '%';
      if(usersEl) usersEl.textContent = users.toLocaleString('en-US');
    }
    tick();
    setInterval(tick, 1200 + Math.random() * 900);

  // One-tap unmute: loads the YouTube IFrame API so the overlay
  // button can reliably turn sound on with a single click (unmuting
  // in direct response to a click is always allowed by browsers,
  // even though silent autoplay on page load is required).
  function setupUnmuteButton(){
    const btn = document.getElementById('bioUnmuteBtn');
    const iframeEl = document.getElementById('bioYtPlayer');
    if(!btn || !iframeEl) return;

    let ytPlayer = null;

    btn.addEventListener('click', function(){
      if(ytPlayer && typeof ytPlayer.unMute === 'function'){

        ytPlayer.playVideo();
      }
      btn.classList.add('bio-hide');
    });

    function showVideoFallback(){
      const wrap = document.querySelector('.bio-video-wrap');
      if(!wrap) return;
      const vid = wrap.dataset.videoId || '';
      const thumb = vid ? ('https://img.youtube.com/vi/' + vid + '/maxresdefault.jpg') : '';
      wrap.innerHTML = `

          ${thumb ? `<img src="${thumb}" alt="Watch on YouTube">` : ''}
          <div class="fallback-label">Watch on YouTube</div>
        </a>`;
    }

    function initPlayer(){
      ytPlayer = new YT.Player('bioYtPlayer', {
        events: {
          onReady: function(){},
          onError: function(){
            // show a clickable fallback that links to YouTube
            showVideoFallback();
          }
        }
      });
    }

    if(window.YT && window.YT.Player){
      initPlayer();
    } else {
      const prevReady = window.onYouTubeIframeAPIReady;
      window.onYouTubeIframeAPIReady = function(){
        if(typeof prevReady === 'function') prevReady();
        initPlayer();
      };
      if(!document.getElementById('bioYtApiScript')){
        const tag = document.createElement('script');
        tag.id = 'bioYtApiScript';
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);
      }
    }

  // Subtle UI sound effects — synthesized live with the Web Audio
  // API, not audio files, so nothing to upload and no copyright
  // concerns. Two short original tones: a light blip for icons, a
  // quick two-note blip for cards/buttons.
  function setupSoundEffects(){
    if(!CONFIG.enableSoundEffects) return;
    let audioCtx = null;

    function getCtx(){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      if(!audioCtx) audioCtx = new AC();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function tone(freq, duration, delay, volume){
      const ctx = getCtx();
      if(!ctx) return;
      const start = ctx.currentTime + (delay || 0);
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(volume, start + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(start);
      osc.stop(start + duration + 0.02);
    }

    function playIconBlip(){ tone(1180, 0.06, 0, 0.05); }
    function playCardBlip(){ tone(700, 0.05, 0, 0.05); tone(980, 0.07, 0.045, 0.05); }

    document.querySelectorAll('.bio-icon-row a').forEach(function(el){
      el.addEventListener('click', playIconBlip);
    });
    document.querySelectorAll('.bio-card').forEach(function(el){
      el.addEventListener('click', playCardBlip);
    });
    const unmuteBtn = document.getElementById('bioUnmuteBtn');
    if(unmuteBtn) unmuteBtn.addEventListener('click', playIconBlip);
  }

  function setupVideoPoster(){
    const poster = document.getElementById('bioVideoPoster');
    if(!poster) return;
    poster.addEventListener('click', function onPlayClick(e){
      const wrap = poster.closest('.bio-video-wrap');
      if(!wrap) return;
      const embedSrc = poster.getAttribute('data-embed-src') || poster.dataset.embedSrc || '';
      // create iframe and insert before the unmute button
      const iframe = document.createElement('iframe');
      iframe.id = 'bioYtPlayer';
      iframe.src = embedSrc;
      iframe.title = 'Latest video';
      iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
      iframe.setAttribute('allowfullscreen', '');
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      const unmuteBtn = wrap.querySelector('.bio-unmute-btn');
      if(unmuteBtn) wrap.insertBefore(iframe, unmuteBtn);
      else wrap.appendChild(iframe);
      poster.removeEventListener('click', onPlayClick);
      poster.remove();
      // now wire up unmute/player functionality for the newly inserted iframe
      try{ setupUnmuteButton(); }catch(e){/* ignore */}
    });
  }

  // if found. The page already shows CONFIG.spotifyUrl instantly
  // on load, so this only replaces it if something fresher exists
  // — visitors never see a blank/loading state either way.
  function fetchLatestRelease(){
    if(!CONFIG.latestReleaseEndpoint) return;
    fetch(CONFIG.latestReleaseEndpoint)
      .then(function(res){ return res.ok ? res.json() : null; })
      .then(function(data){
        if(!data || !data.id || !data.type) return;
        const iframe = document.getElementById('bioSpotifyIframe');
        if(!iframe) return;
        iframe.src = 'https://open.spotify.com/embed/' + data.type + '/' + data.id + '?utm_source=generator';
      })
      .catch(function(){ /* keep showing the CONFIG.spotifyUrl fallback that's already loaded */ });
  }

  render();
  setupVideoPoster();
  if(CONFIG.showStatsBar) startStatsLoop();
  setupUnmuteButton();
  setupSoundEffects();
  fetchLatestRelease();
  // If the iframe failed silently (no YT API error), also add a short timeout
  // to detect common "Video unavailable" cases and replace with fallback.
  setTimeout(function(){
    const wrap = document.querySelector('.bio-video-wrap');
    if(!wrap) return;
    const iframe = wrap.querySelector('iframe');
    if(iframe && iframe.contentWindow){
      // try to read readyState via postMessage is not reliable cross-origin;
      // instead check whether the iframe has a visible poster by loading image.
      const vid = wrap.dataset.videoId || '';
      if(vid){
        const img = new Image();
        img.onload = function(){ /* ok, thumbnail exists */ };
        img.onerror = function(){
          // thumbnail not reachable — likely removed/private; show fallback link
          const fallbackLink = wrap.querySelector('.bio-video-fallback');
          if(!fallbackLink) {
            const thumb = 'https://img.youtube.com/vi/' + vid + '/maxresdefault.jpg';
            wrap.innerHTML = `\n              <a class="bio-video-fallback" href="https://www.youtube.com/watch?v=${vid}" target="_blank" rel="noopener">\n                <div class="fallback-label">Watch on YouTube</div>\n              </a>`;
          }
        };
        img.src = 'https://img.youtube.com/vi/' + vid + '/maxresdefault.jpg';
      }
    }
  }, 1800);
})();
</script>
</body>
</html>
